openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    IQmeetEQ Workshop Companion API.

    Cohort-based workshop app: each workshop runs as its own virtual app
    instance keyed by cohort code. Participants sign in with name + email +
    cohort code; admins sign in with a single admin password.

    All participant endpoints require an authenticated session cookie
    (`iqmeq_session`). Admin endpoints additionally require an admin session.
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: auth
    description: Participant + admin authentication
  - name: sections
    description: Workshop sections (visibility, unlock codes, content)
  - name: notes
    description: Per-participant per-section notes
  - name: workflow-map
    description: Per-participant workflow map data
  - name: responses
    description: Explicit form submissions from collecting form blocks
  - name: feedback
    description: Participant feedback to facilitator
  - name: content-variants
    description: Per-cohort content overrides for hardcoded sections
  - name: llm-tools
    description: Public catalog of LLM tools surfaced in the UI
  - name: safari-tabs
    description: Per-cohort safari (resource) tabs
  - name: app-settings
    description: Public app-wide key/value settings
  - name: admin-cohorts
    description: Admin cohort management (CRUD)
  - name: admin-sections
    description: Admin section ordering, codes, visibility, generic sections
  - name: admin-variants
    description: Admin per-cohort content variants
  - name: admin-safari
    description: Admin safari library + per-cohort lineup
  - name: admin-llm-tools
    description: Admin LLM tool catalog
  - name: admin-feedback
    description: Admin feedback review + categories
  - name: admin-settings
    description: Admin app-wide key/value settings
  - name: admin-participants
    description: Admin participant management

paths:
  /admin/cohort-logos:
    post:
      operationId: uploadCohortLogo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CohortLogoUpload" }
      responses:
        "201":
          description: Uploaded logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortLogo" }
  /cohort-logos/{id}:
    get:
      operationId: getCohortLogo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Image bytes for an authorized cohort participant or admin
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: participantLogin
      tags: [auth]
      summary: Log in (or sign up) a participant by name + email + cohort code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/check-email:
    post:
      operationId: participantCheckEmail
      tags: [auth]
      summary: Check whether an email is already registered as a participant
      description: Lightweight existence check that does NOT create or modify any session. Used by the login form to switch into the "returning participant" flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckEmailRequest" }
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckEmailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/logout:
    post:
      operationId: participantLogout
      tags: [auth]
      summary: Clear the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /auth/me:
    get:
      operationId: getCurrentParticipant
      tags: [auth]
      summary: Return the currently authenticated participant + cohort
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Authenticate as admin via shared password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Authenticated as admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Clear the admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /sections:
    get:
      operationId: listSections
      tags: [sections]
      summary: List visible sections for the current participant's cohort
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sections/unlock:
    post:
      operationId: unlockSection
      tags: [sections]
      summary: Submit an unlock code; unlocks all matching sections in the cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlockRequest" }
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notes/{sectionId}:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    get:
      operationId: getNotes
      tags: [notes]
      summary: List the participant's notes for a section
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: upsertNote
      tags: [notes]
      summary: Create or update a note for a section + field key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /responses:
    post:
      operationId: submitFormResponse
      tags: [responses]
      summary: Submit (or resubmit) the assembled text of a collecting form block
      description: >
        Stores the participant's assembled form text for one form block.
        Rejects (400) if the block is not a form with collectResponses=true,
        (403) if the block's responsesOpen is false, and (404) if the section
        is not unlocked for the participant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormResponseSubmitRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormResponseSubmitResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Submissions closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /responses/mine:
    get:
      operationId: listMyFormSubmissions
      tags: [responses]
      summary: The participant's own form submissions (section, block, last submitted time)
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyFormSubmissionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /poll-responses:
    post:
      operationId: submitPollResponse
      tags: [responses]
      summary: Submit (or resubmit) answers to a poll block
      description: >
        Validates answers against the block's current questions and choices
        (400 on unknown keys/choices or missing answers), 403 when the poll's
        responsesOpen is false, 404 when the section is not unlocked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollResponseSubmitRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollResponseSubmitResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Submissions closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /poll-responses/mine:
    get:
      operationId: listMyPollSubmissions
      tags: [responses]
      summary: The participant's own poll submissions with answers
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPollSubmissionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /poll-responses/results:
    get:
      operationId: getPollResults
      tags: [responses]
      summary: Per-choice counts for a poll with showResults on (after the participant submitted)
      parameters:
        - name: sectionId
          in: query
          required: true
          schema: { type: string }
        - name: blockIndex
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollResultsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Results not available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workflow-map:
    get:
      operationId: getWorkflowMap
      tags: [workflow-map]
      summary: Get the current participant's workflow map document
      responses:
        "200":
          description: Workflow map (or null if not yet created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMapResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: upsertWorkflowMap
      tags: [workflow-map]
      summary: Create or update the participant's workflow map document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowMapUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMapResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /feedback:
    get:
      operationId: listMyFeedback
      tags: [feedback]
      summary: List the participant's feedback entries
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: upsertFeedback
      tags: [feedback]
      summary: Submit feedback (one entry per category, or many uncategorized)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /feedback/categories:
    get:
      operationId: listFeedbackCategories
      tags: [feedback]
      summary: List active feedback categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackCategoriesResponse" }

  /content-variants/{sectionId}:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    get:
      operationId: getContentVariants
      tags: [content-variants]
      summary: Per-cohort content overrides for blocks within a hardcoded section
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVariantsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /llm-tools:
    get:
      operationId: listLlmTools
      tags: [llm-tools]
      summary: List active LLM tools shown in the UI
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmToolsResponse" }

  /safari-tabs:
    get:
      operationId: listSafariTabs
      tags: [safari-tabs]
      summary: List safari tabs assigned to the current participant's cohort
      responses:
        "200":
          description: Tabs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafariTabsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /app-settings:
    get:
      operationId: getAppSettings
      tags: [app-settings]
      summary: Public app-wide key/value settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettingsResponse" }

  # ===== Admin =============================================================

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Whether the current session is admin
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMeResponse" }

  /admin/cohorts:
    get:
      operationId: adminListCohorts
      tags: [admin-cohorts]
      summary: List all cohorts (newest first)
      responses:
        "200":
          description: Cohorts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateCohort
      tags: [admin-cohorts]
      summary: Create a new cohort and seed default sections
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Cohort code already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/cohorts/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    get:
      operationId: adminGetCohort
      tags: [admin-cohorts]
      summary: Get a single cohort
      responses:
        "200":
          description: Cohort
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: adminUpdateCohort
      tags: [admin-cohorts]
      summary: Update a cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteCohort
      tags: [admin-cohorts]
      summary: Delete a cohort (only if it has no participants)
      description: Cascades cohort_sections, cohort_safari_tabs, content_variants. Returns 409 if any participants are still attached.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/cohorts/{id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    post:
      operationId: adminDuplicateCohort
      tags: [admin-cohorts]
      summary: Duplicate a cohort
      description: Creates a new cohort copying settings, level names, messages, open levels, and every section row (levels, order, visibility, codes). Admin-created generic sections are cloned into new library rows so the cohorts never share editable content; built-in sections and seeded modules are referenced. Participants, notes, unlocks, and form responses are not copied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortDuplicateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortDuplicateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Cohort code already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/cohorts/{cohortId}/sections:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    get:
      operationId: adminListCohortSections
      tags: [admin-sections]
      summary: List a cohort's section configuration (rows in cohort_sections)
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminCohortSectionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: adminBulkUpdateCohortSections
      tags: [admin-sections]
      summary: Replace the cohort's section list (ordering, codes, visibility)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AdminCohortSectionInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBulkCountResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/sections/{sectionId}/make-editable:
    parameters:
      - $ref: "#/components/parameters/CohortId"
      - $ref: "#/components/parameters/SectionId"
    post:
      operationId: adminMakeSectionEditable
      tags: [admin-sections]
      summary: Convert a built-in section row into an editable library section
      description: Creates a new generic library section from the built-in section's content (same title, goal, type, notes setting; default level = the built-in's level), repoints this cohort's row at it (keeping level, sort order, display name, visibility, code and code-active), and copies this cohort's participant notes to matching field keys. Other cohorts are unaffected. Refused (422) when the built-in contains an element the generic block types cannot express.
      responses:
        "201":
          description: Converted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMakeEditableResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Built-in section cannot be expressed with generic blocks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMakeEditableBlockedResponse" }

  /admin/cohorts/{cohortId}/unlock-all:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    post:
      operationId: adminUnlockAllForCohort
      tags: [admin-sections]
      summary: Unlock every visible section for every participant in the cohort
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnlockAllResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/groups:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    get:
      operationId: adminListCohortGroups
      tags: [admin-sections]
      summary: List a cohort's section groups with section counts
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortGroupsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: adminCreateCohortGroup
      tags: [admin-sections]
      summary: Add a group (appended last, locked)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortGroupCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortGroupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/cohorts/{cohortId}/groups/reorder:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    put:
      operationId: adminReorderCohortGroups
      tags: [admin-sections]
      summary: Reorder a cohort's groups (every group id exactly once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortGroupReorderRequest" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortGroupsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/CohortId"
      - name: groupId
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: adminUpdateCohortGroup
      tags: [admin-sections]
      summary: Rename a group or toggle open/locked
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortGroupUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortGroupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteCohortGroup
      tags: [admin-sections]
      summary: Delete an empty group (hidden sections count as non-empty)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/topics:
    get:
      operationId: adminListTopics
      tags: [admin-sections]
      summary: List library topics with section counts
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTopicsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateTopic
