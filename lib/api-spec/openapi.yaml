openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    IQmeetEQ Workshop Companion API.

    Cohort-based workshop app: each workshop runs as its own virtual app
    instance keyed by cohort code. Participants sign in with name + email +
    cohort code; admins sign in with a single admin password.

    All participant endpoints require an authenticated session cookie
    (`iqmeq_session`). Admin endpoints additionally require an admin session.
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: auth
    description: Participant + admin authentication
  - name: sections
    description: Workshop sections (visibility, unlock codes, content)
  - name: notes
    description: Per-participant per-section notes
  - name: workflow-map
    description: Per-participant workflow map data
  - name: feedback
    description: Participant feedback to facilitator
  - name: content-variants
    description: Per-cohort content overrides for hardcoded sections
  - name: llm-tools
    description: Public catalog of LLM tools surfaced in the UI
  - name: safari-tabs
    description: Per-cohort safari (resource) tabs
  - name: app-settings
    description: Public app-wide key/value settings
  - name: admin-cohorts
    description: Admin cohort management (CRUD)
  - name: admin-sections
    description: Admin section ordering, codes, visibility, generic sections
  - name: admin-variants
    description: Admin per-cohort content variants
  - name: admin-safari
    description: Admin safari library + per-cohort lineup
  - name: admin-llm-tools
    description: Admin LLM tool catalog
  - name: admin-feedback
    description: Admin feedback review + categories
  - name: admin-settings
    description: Admin app-wide key/value settings
  - name: admin-participants
    description: Admin participant management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: participantLogin
      tags: [auth]
      summary: Log in (or sign up) a participant by name + email + cohort code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/check-email:
    post:
      operationId: participantCheckEmail
      tags: [auth]
      summary: Check whether an email is already registered as a participant
      description: Lightweight existence check that does NOT create or modify any session. Used by the login form to switch into the "returning participant" flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckEmailRequest" }
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckEmailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/logout:
    post:
      operationId: participantLogout
      tags: [auth]
      summary: Clear the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /auth/me:
    get:
      operationId: getCurrentParticipant
      tags: [auth]
      summary: Return the currently authenticated participant + cohort
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Authenticate as admin via shared password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Authenticated as admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Clear the admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /sections:
    get:
      operationId: listSections
      tags: [sections]
      summary: List visible sections for the current participant's cohort
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sections/unlock:
    post:
      operationId: unlockSection
      tags: [sections]
      summary: Submit an unlock code; unlocks all matching sections in the cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlockRequest" }
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notes/{sectionId}:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    get:
      operationId: getNotes
      tags: [notes]
      summary: List the participant's notes for a section
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: upsertNote
      tags: [notes]
      summary: Create or update a note for a section + field key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workflow-map:
    get:
      operationId: getWorkflowMap
      tags: [workflow-map]
      summary: Get the current participant's workflow map document
      responses:
        "200":
          description: Workflow map (or null if not yet created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMapResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: upsertWorkflowMap
      tags: [workflow-map]
      summary: Create or update the participant's workflow map document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowMapUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMapResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /feedback:
    get:
      operationId: listMyFeedback
      tags: [feedback]
      summary: List the participant's feedback entries
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: upsertFeedback
      tags: [feedback]
      summary: Submit feedback (one entry per category, or many uncategorized)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /feedback/categories:
    get:
      operationId: listFeedbackCategories
      tags: [feedback]
      summary: List active feedback categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackCategoriesResponse" }

  /content-variants/{sectionId}:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    get:
      operationId: getContentVariants
      tags: [content-variants]
      summary: Per-cohort content overrides for blocks within a hardcoded section
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVariantsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /llm-tools:
    get:
      operationId: listLlmTools
      tags: [llm-tools]
      summary: List active LLM tools shown in the UI
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmToolsResponse" }

  /safari-tabs:
    get:
      operationId: listSafariTabs
      tags: [safari-tabs]
      summary: List safari tabs assigned to the current participant's cohort
      responses:
        "200":
          description: Tabs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafariTabsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /app-settings:
    get:
      operationId: getAppSettings
      tags: [app-settings]
      summary: Public app-wide key/value settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettingsResponse" }

  # ===== Admin =============================================================

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Whether the current session is admin
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMeResponse" }

  /admin/cohorts:
    get:
      operationId: adminListCohorts
      tags: [admin-cohorts]
      summary: List all cohorts (newest first)
      responses:
        "200":
          description: Cohorts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateCohort
      tags: [admin-cohorts]
      summary: Create a new cohort and seed default sections
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Cohort code already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/cohorts/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    get:
      operationId: adminGetCohort
      tags: [admin-cohorts]
      summary: Get a single cohort
      responses:
        "200":
          description: Cohort
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: adminUpdateCohort
      tags: [admin-cohorts]
      summary: Update a cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCohortUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCohortResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteCohort
      tags: [admin-cohorts]
      summary: Delete a cohort (only if it has no participants)
      description: Cascades cohort_sections, cohort_safari_tabs, content_variants. Returns 409 if any participants are still attached.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/cohorts/{cohortId}/sections:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    get:
      operationId: adminListCohortSections
      tags: [admin-sections]
      summary: List a cohort's section configuration (rows in cohort_sections)
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminCohortSectionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: adminBulkUpdateCohortSections
      tags: [admin-sections]
      summary: Replace the cohort's section list (ordering, codes, visibility)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AdminCohortSectionInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBulkCountResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/unlock-all:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    post:
      operationId: adminUnlockAllForCohort
      tags: [admin-sections]
      summary: Unlock every visible section for every participant in the cohort
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnlockAllResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/variants:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    get:
      operationId: adminListCohortVariants
      tags: [admin-variants]
      summary: List content variants for a cohort
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminCohortVariantsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: adminUpsertCohortVariant
      tags: [admin-variants]
      summary: Upsert (or clear with empty content) a content variant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVariantUpsertRequest" }
      responses:
        "200":
          description: Saved or deleted
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminVariantUpsertResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/generic-sections:
    get:
      operationId: adminListGenericSections
      tags: [admin-sections]
      summary: List all generic (admin-authored) section bodies
      responses:
        "200":
          description: Generic sections
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminGenericSectionListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateGenericSection
      tags: [admin-sections]
      summary: Create a generic section body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGenericSectionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminGenericSectionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/generic-sections/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    put:
      operationId: adminUpdateGenericSection
      tags: [admin-sections]
      summary: Update a generic section body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGenericSectionRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminGenericSectionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteGenericSection
      tags: [admin-sections]
      summary: Delete a generic section body and remove it from all cohorts
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/safari-library:
    get:
      operationId: adminListSafariLibrary
      tags: [admin-safari]
      summary: List all safari library tools
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminSafariLibraryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateSafariLibraryItem
      tags: [admin-safari]
      summary: Create a safari library tool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSafariLibraryCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminSafariLibraryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/safari-library/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    put:
      operationId: adminUpdateSafariLibraryItem
      tags: [admin-safari]
      summary: Update a safari library tool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSafariLibraryUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminSafariLibraryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteSafariLibraryItem
      tags: [admin-safari]
      summary: Delete a safari library tool (and cascade lineup rows)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/safari-tabs:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    get:
      operationId: adminListCohortSafariTabs
      tags: [admin-safari]
      summary: List a cohort's safari lineup
      responses:
        "200":
          description: Tabs
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminCohortSafariTabsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: adminBulkUpdateCohortSafariTabs
      tags: [admin-safari]
      summary: Replace a cohort's safari lineup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                { $ref: "#/components/schemas/AdminCohortSafariTabInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBulkCountResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/llm-tools:
    get:
      operationId: adminListLlmTools
      tags: [admin-llm-tools]
      summary: List all LLM tools (including inactive)
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLlmToolListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateLlmTool
      tags: [admin-llm-tools]
      summary: Create an LLM tool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLlmToolCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLlmToolResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/llm-tools/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    put:
      operationId: adminUpdateLlmTool
      tags: [admin-llm-tools]
      summary: Update an LLM tool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLlmToolUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLlmToolResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteLlmTool
      tags: [admin-llm-tools]
      summary: Delete an LLM tool
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/feedback-categories:
    get:
      operationId: adminListFeedbackCategories
      tags: [admin-feedback]
      summary: List all feedback categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackCategoriesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: adminCreateFeedbackCategory
      tags: [admin-feedback]
      summary: Create a feedback category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AdminFeedbackCategoryCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminFeedbackCategoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/feedback-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    put:
      operationId: adminUpdateFeedbackCategory
      tags: [admin-feedback]
      summary: Update a feedback category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AdminFeedbackCategoryUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminFeedbackCategoryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminDeleteFeedbackCategory
      tags: [admin-feedback]
      summary: Delete a feedback category
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/settings:
    get:
      operationId: adminListSettings
      tags: [admin-settings]
      summary: List all app settings (key/value rows)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettingsListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: adminUpsertSetting
      tags: [admin-settings]
      summary: Upsert a single key/value app setting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingUpsertRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettingResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cohorts/{cohortId}/participants:
    parameters:
      - $ref: "#/components/parameters/CohortId"
    get:
      operationId: adminListCohortParticipants
      tags: [admin-participants]
      summary: List participants in a cohort with note + unlock counts
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminParticipantListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/participants/{id}/active:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    patch:
      operationId: adminSetParticipantActive
      tags: [admin-participants]
      summary: Set a participant's active flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminParticipantActiveRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminParticipantResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/participants/{id}:
    parameters:
      - $ref: "#/components/parameters/IntegerId"
    delete:
      operationId: adminDeleteParticipant
      tags: [admin-participants]
      summary: Delete a participant and all their data
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/feedback:
    get:
      operationId: adminListFeedback
      tags: [admin-feedback]
      summary: List feedback (optionally filtered by cohort or category)
      parameters:
        - in: query
          name: cohort_id
          required: false
          schema: { type: string }
        - in: query
          name: category
          required: false
          schema: { type: string }
        - in: query
          name: sort
          required: false
          schema: { type: string, enum: [date, id] }
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeedbackListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  parameters:
    SectionId:
      name: sectionId
      in: path
      required: true
      description: Section id (e.g. `welcome`, `iq-meets-eq`, `generic_42`)
      schema: { type: string, minLength: 1 }
    IntegerId:
      name: id
      in: path
      required: true
      description: Numeric id
      schema: { type: integer }
    CohortId:
      name: cohortId
      in: path
      required: true
      description: Numeric cohort id
      schema: { type: integer }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict — request cannot complete in the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    LoginRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        # Optional: when omitted, the server resolves the participant by
        # email alone (their most recent cohort). The login form sends an
        # empty/omitted code in the returning-user flow once the email is
        # recognized via /auth/check-email.
        cohortCode: { type: string }

    CheckEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    CheckEmailResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
        name:
          type: string
          nullable: true

    Participant:
      type: object
      required: [id, name, email, cohortId, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        cohortId: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    Cohort:
      type: object
      required: [id, name, facilitatorMessage, tierAccess, audienceType]
      properties:
        id: { type: integer }
        name: { type: string }
        facilitatorMessage: { type: string }
        homeMessage:
          type: string
          nullable: true
          description: HTML rendered above the action cards on the participant home page.
        tierAccess:
          type: object
          additionalProperties: { type: boolean }
          description: 'Map of tier level to default-unlocked boolean, e.g. {"1": true, "2": false}'
        audienceType: { type: string }

    LoginResponse:
      type: object
      required: [participant, isNew]
      properties:
        participant: { $ref: "#/components/schemas/Participant" }
        isNew: { type: boolean }

    MeResponse:
      type: object
      required: [participant, cohort]
      properties:
        participant: { $ref: "#/components/schemas/Participant" }
        cohort: { $ref: "#/components/schemas/Cohort" }

    AdminLoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }

    Section:
      type: object
      required: [id, title, description, level, sortOrder, type, unlocked, hasCode, hasNotes, isGeneric]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        level: { type: integer }
        sortOrder: { type: integer }
        type:
          type: string
          enum: [exercise, reference, locked]
        unlocked: { type: boolean }
        hasCode: { type: boolean }
        hasNotes:
          type: boolean
          description: True when the current participant has saved at least one non-empty note for this section.
        isGeneric: { type: boolean }
        generic:
          nullable: true
          type: object
          required: [contentBlocks, goalText]
          properties:
            contentBlocks:
              type: array
              items: { $ref: "#/components/schemas/GenericContentBlock" }
            goalText: { type: string, nullable: true }

    GenericContentBlock:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [text, prompt]
        content: { type: string }

    SectionsResponse:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/Section" }

    UnlockRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }

    UnlockedSectionSummary:
      type: object
      required: [id, title, level, type]
      properties:
        id: { type: string }
        title: { type: string }
        level: { type: integer }
        type: { type: string }

    UnlockResponse:
      type: object
      required: [section, unlockedCount]
      properties:
        section: { $ref: "#/components/schemas/UnlockedSectionSummary" }
        unlockedCount: { type: integer }

    Note:
      type: object
      required: [sectionId, fieldKey, content, updatedAt]
      properties:
        sectionId: { type: string }
        fieldKey: { type: string }
        content: { type: string }
        updatedAt: { type: string, format: date-time }

    NotesResponse:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }

    NoteUpsertRequest:
      type: object
      required: [content]
      properties:
        fieldKey:
          type: string
          minLength: 1
          default: notes
        content: { type: string }

    NoteRecord:
      type: object
      required: [id, participantId, sectionId, fieldKey, content, createdAt, updatedAt]
      properties:
        id: { type: integer }
        participantId: { type: integer }
        sectionId: { type: string }
        fieldKey: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoteResponse:
      type: object
      required: [note]
      properties:
        note: { $ref: "#/components/schemas/NoteRecord" }

    WorkflowMap:
      type: object
      required: [id, participantId, data, createdAt, updatedAt]
      properties:
        id: { type: integer }
        participantId: { type: integer }
        data: {}
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkflowMapResponse:
      type: object
      required: [workflowMap]
      properties:
        workflowMap:
          oneOf:
            - $ref: "#/components/schemas/WorkflowMap"
            - type: "null"

    WorkflowMapUpsertRequest:
      type: object
      required: [data]
      properties:
        data: {}

    Feedback:
      type: object
      required: [id, participantId, cohortId, content, createdAt, updatedAt]
      properties:
        id: { type: integer }
        participantId: { type: integer }
        cohortId: { type: integer }
        category:
          type: string
          nullable: true
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FeedbackListResponse:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: array
          items: { $ref: "#/components/schemas/Feedback" }

    FeedbackUpsertRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        category:
          type: string
          nullable: true

    FeedbackResponse:
      type: object
      required: [feedback]
      properties:
        feedback: { $ref: "#/components/schemas/Feedback" }

    FeedbackCategory:
      type: object
      required: [id, name, sortOrder, active]
      properties:
        id: { type: integer }
        name: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }

    FeedbackCategoriesResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/FeedbackCategory" }

    ContentVariant:
      type: object
      required: [blockKey, content]
      properties:
        blockKey: { type: string }
        content: { type: string }

    ContentVariantsResponse:
      type: object
      required: [variants]
      properties:
        variants:
          type: array
          items: { $ref: "#/components/schemas/ContentVariant" }

    LlmTool:
      type: object
      required: [id, name, displayLabel, url, showInSidebar, showInVerification]
      properties:
        id: { type: integer }
        name: { type: string }
        displayLabel: { type: string }
        url: { type: string }
        showInSidebar: { type: boolean }
        showInVerification: { type: boolean }

    LlmToolsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/LlmTool" }

    SafariTab:
