components:
  parameters:
    SectionId:
      name: sectionId
      in: path
      required: true
      description: Section id (e.g. `welcome`, `iq-meets-eq`, `generic_42`)
      schema: { type: string, minLength: 1 }
    IntegerId:
      name: id
      in: path
      required: true
      description: Numeric id
      schema: { type: integer }
    CohortId:
      name: cohortId
      in: path
      required: true
      description: Numeric cohort id
      schema: { type: integer }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict — request cannot complete in the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    LoginRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        # Optional: when omitted, the server resolves the participant by
        # email alone (their most recent cohort). The login form sends an
        # empty/omitted code in the returning-user flow once the email is
        # recognized via /auth/check-email.
        cohortCode: { type: string }

    CheckEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    CheckEmailResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
        name:
          type: string
          nullable: true

    Participant:
      type: object
      required: [id, name, email, cohortId, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        cohortId: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    CohortLogoUpload:
      type: object
      required: [filename, mimeType, dataBase64]
      properties:
        filename: { type: string }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/svg+xml] }
        dataBase64: { type: string }
    CohortLogo:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [builtin, image] }
        fileId: { type: integer }
        name: { type: string }
    CohortTalkCard:
      type: object
      properties:
        label: { type: string }
        title: { type: string }
        description: { type: string }
        link: { type: string }
    CohortSettings:
      type: object
      additionalProperties: true
      properties:
        logos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/CohortLogo" }
        talkCards:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/CohortTalkCard" }
        facilitatorMessageHeading: { type: string }
        workbookTitle: { type: string }
        workbookSubtitle: { type: string }
        workbookBrand: { type: string }
    Cohort:
      type: object
      required: [id, name, facilitatorMessage, tierAccess, audienceType]
      properties:
        settings: { $ref: "#/components/schemas/CohortSettings" }
        id: { type: integer }
        name: { type: string }
        facilitatorMessage: { type: string }
        homeMessage:
          type: string
          nullable: true
          description: HTML rendered above the action cards on the participant home page.
        tierAccess:
          type: object
          additionalProperties: { type: boolean }
          description: 'Map of tier level to default-unlocked boolean, e.g. {"1": true, "2": false}'
        audienceType: { type: string }
        showCoachingLinks:
          type: boolean
          deprecated: true
          description: Frozen legacy value, retained for migration verification.
        showSelfAssessment:
          type: boolean
          description: Shows the Home self-assessment card and allows access to /levels. New cohorts default false.
        showContactCards:
          type: boolean
          description: Shows contact cards on Home and their top-bar links. New cohorts default true.
        levelNames:
          type: object
          additionalProperties: { type: string }
          deprecated: true
          description: 'Legacy (frozen). Use groups.'
        groups:
          type: array
          description: Ordered section groups of this cohort (replaces levels).
          items: { $ref: "#/components/schemas/SectionGroup" }

    SectionGroup:
      type: object
      required: [id, name, sortOrder, isOpen]
      properties:
        id: { type: integer }
        name: { type: string }
        sortOrder: { type: integer }
        isOpen:
          type: boolean
          description: Open groups unlock every section inside them for all participants.

    LoginResponse:
      type: object
      required: [participant, isNew]
      properties:
        participant: { $ref: "#/components/schemas/Participant" }
        isNew: { type: boolean }

    MeResponse:
      type: object
      required: [participant, cohort]
      properties:
        participant: { $ref: "#/components/schemas/Participant" }
        cohort: { $ref: "#/components/schemas/Cohort" }

    AdminLoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }

    Section:
      type: object
      required: [id, title, description, level, groupId, sortOrder, type, unlocked, hasCode, hasNotes, isGeneric]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        level: { type: integer, deprecated: true, description: Legacy level (frozen); use groupId. }
        groupId: { type: integer }
        sortOrder: { type: integer }
        type:
          type: string
          enum: [exercise, reference, locked]
        unlocked: { type: boolean }
        hasCode: { type: boolean }
        hasNotes:
          type: boolean
          description: True when the current participant has saved at least one non-empty note for this section.
        isGeneric: { type: boolean }
        generic:
          nullable: true
          type: object
          required: [contentBlocks, goalText, showNotesField, badgeLabel]
          properties:
            contentBlocks:
              type: array
              items: { $ref: "#/components/schemas/GenericContentBlock" }
            goalText: { type: string, nullable: true }
            showNotesField: { type: boolean }
            badgeLabel: { type: string, nullable: true }

    GenericContentBlock:
      type: object
      required: [type]
      description: >
        One block of a generic section body. `type` discriminates the shape:
        text/prompt use `content`; callout uses `variant`, `title?`, `content`;
        cards uses `columns` + `cards`; steps uses `ordered` + `items`;
        link uses `url` + `label` + `style`; field uses `fieldKey`, `label`,
        `placeholder?`, `helpText?`, `prefill?`, `multiline`; form uses
        `fields` + `buttonLabel` + `copyStyle`; download uses `fileId` +
        `label?`. Prompt `content` and field `prefill` may contain
        `{{sectionId:fieldKey}}` placeholders, resolved client-side to the
        participant's own saved answer in that section/field (empty string
        if unsaved).
      properties:
        type:
          type: string
          enum: [text, prompt, callout, cards, steps, link, field, form, download, recap, image, poll]
        content: { type: string }
        label: { type: string }
        buttonLabel: { type: string }
        variant:
          type: string
          enum: [stop, insight, rule, quote]
        title: { type: string }
        columns:
          type: integer
          enum: [1, 2, 3]
        cards:
          type: array
          items: { $ref: "#/components/schemas/GenericBlockItem" }
        ordered: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/GenericBlockItem" }
        url: { type: string }
        style:
          type: string
          enum: [button, text]
        fieldKey: { type: string }
        placeholder: { type: string }
        helpText:
          type: string
          description: >
            Optional rich-text help shown between the field's label and its
            input. Sanitized server-side like text block content.
        heading:
          type: string
          description: Card layout only - bold heading shown under the label pill.
        multiline: { type: boolean }
        prefill:
          type: string
          description: >
            For field blocks: the field's starting text. May contain
            {{sectionId:fieldKey}} placeholders resolved to the
            participant's own saved answers. The participant can edit the
            result; edits save to this field normally.
        copyStyle:
          type: string
          enum: [labeled, joined]
        fields:
          type: array
          items: { $ref: "#/components/schemas/GenericFormField" }
        pollName:
          type: string
          description: For poll blocks - admin-facing name shown in the Responses tab and on the Board.
        questions:
          type: array
          description: For poll blocks - at least one question.
          items: { $ref: "#/components/schemas/GenericPollQuestion" }
        showResults:
          type: boolean
          description: For poll blocks - show per-choice counts to participants after they submit. Default false.
        preview:
          type: boolean
          description: >
            Legacy flag for form blocks. Form blocks now always render the
            live-updating preview box with the copy button attached; this
            field is accepted for backward compatibility but ignored by the
            renderer.
        cardLayout:
          type: boolean
          description: For form blocks - render each field in its own bordered card. Default false.
        formName:
          type: string
          description: For form blocks - admin-facing name shown in the Responses tab.
        collectResponses:
          type: boolean
          description: For form blocks - show a Submit button that stores the assembled text. Default false.
        responsesOpen:
          type: boolean
          description: For form blocks - when false, submissions are closed. Default true.
        oneSubmissionOnly:
          type: boolean
          description: For form and poll blocks - when true a participant can't change their answer after submitting (409 on resubmit). Default false.
        showPromptBox:
          type: boolean
          description: >
            For form blocks - when false, the dark "Your prompt" box with the
            assembled text is hidden; the Copy/Submit action row renders with
            the fields instead. Missing = true.
        showCopyButton:
          type: boolean
          description: >
            For form blocks - whether the Copy button renders. Missing = same
            as the effective showPromptBox value.
        boxLabel:
          type: string
          description: >
            For form blocks - gold label on the assembled-text box. Missing =
            "Your prompt"; empty string = no label; other text shown as typed.
        template:
          type: string
          description: >
            For form blocks: optional assembly template. Single-brace
            `{fieldKey}` placeholders are replaced live with that field's
            current value as the participant types; an empty field resolves
            to nothing (no raw braces are shown). If blank, answers assemble
            using `copyStyle` (labeled lines or joined text) as before.
        fileId:
          type: integer
          description: >
            For download blocks: the id of a section file (attached to the
            same section) that the block's button downloads. For image blocks:
            the id of the attached section image to display.
        width:
          type: integer
          description: >
            For image blocks: the maximum render width in pixels. The image
            shrinks responsively below this on narrow screens and never
            exceeds the content column width.
        alignment:
          type: string
          enum: [left, center, right]
          description: >
            For image blocks: horizontal alignment of the image within the
            content column.
        caption:
          type: string
          description: >
            For image blocks: optional caption text shown beneath the image.
        altText:
          type: string
          description: >
            For image blocks: optional alternative text for the img element
            (used by screen readers and shown if the image fails to load).
        source:
          type: string
          description: >
            For recap blocks: the slug (or generic_N id) of the section whose
            saved answers are shown read-only.
        recapFields:
          type: array
          description: >
            For recap blocks: the fields to display from the source section.
            Empty answers are omitted at render time.
          items: { $ref: "#/components/schemas/RecapField" }

